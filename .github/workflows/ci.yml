name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: docuquery
          POSTGRES_USER: docuquery_user
          POSTGRES_PASSWORD: docuquery_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docuquery_user -d docuquery"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.7.4
        ports:
          - 6333:6333

    env:
      APP_ENV: development
      AUTH_SECRET_KEY: ci-development-secret-at-least-32-characters
      ADMIN_PASSWORD: ci-admin-password
      DATABASE_URL: postgresql+psycopg2://docuquery_user:docuquery_password@localhost:5432/docuquery
      QDRANT_URL: http://localhost:6333
      LLM_PROVIDER: openai
      LLM_API_KEY: test-key-not-real
      LLM_MODEL: gpt-4o-mini
      EMBEDDING_PROVIDER: openai
      EMBEDDING_API_KEY: test-key-not-real
      EMBEDDING_MODEL: text-embedding-3-small
      OPENAI_API_KEY: test-key-not-real

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check backend dependency consistency
        working-directory: backend
        run: python -m pip check

      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build
