services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docuquery}
      POSTGRES_USER: ${POSTGRES_USER:-docuquery_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docuquery_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docuquery_user} -d ${POSTGRES_DB:-docuquery}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docuquery-net

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    networks:
      - docuquery-net

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8081}:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-docuquery_user}:${POSTGRES_PASSWORD:-docuquery_password}@postgres:5432/${POSTGRES_DB:-docuquery}
      QDRANT_URL: http://qdrant:6333
      BACKEND_PORT: 8000
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5174}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-change-this-development-secret}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      AUTH_TOKEN_TTL_MINUTES: ${AUTH_TOKEN_TTL_MINUTES:-480}
      PROVIDER_SETTINGS_ENCRYPTION_KEY: ${PROVIDER_SETTINGS_ENCRYPTION_KEY:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      REDIS_URL: ${REDIS_URL:-}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-5}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-20}
      FEEDBACK_RATE_LIMIT_PER_MINUTE: ${FEEDBACK_RATE_LIMIT_PER_MINUTE:-20}
      ADMIN_READ_RATE_LIMIT_PER_MINUTE: ${ADMIN_READ_RATE_LIMIT_PER_MINUTE:-60}
      ADMIN_MUTATION_RATE_LIMIT_PER_MINUTE: ${ADMIN_MUTATION_RATE_LIMIT_PER_MINUTE:-20}
      DOCUMENT_UPLOAD_RATE_LIMIT_PER_HOUR: ${DOCUMENT_UPLOAD_RATE_LIMIT_PER_HOUR:-20}
      EVALUATION_RATE_LIMIT_PER_HOUR: ${EVALUATION_RATE_LIMIT_PER_HOUR:-10}
      OPTIMIZATION_RATE_LIMIT_PER_HOUR: ${OPTIMIZATION_RATE_LIMIT_PER_HOUR:-5}
      MAX_TOP_K: ${MAX_TOP_K:-20}
      MAX_OPTIMIZATION_CONFIGURATIONS: ${MAX_OPTIMIZATION_CONFIGURATIONS:-50}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./data:/app/data
      - ./eval:/app/eval
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - docuquery-net

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-8081}
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    depends_on:
      - backend
    networks:
      - docuquery-net

volumes:
  postgres_data:
  qdrant_storage:

networks:
  docuquery-net:
    driver: bridge
